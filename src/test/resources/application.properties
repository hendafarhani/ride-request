spring.cloud.config.enabled=false
spring.config.import=optional:configserver:

kafka.bootstrap-servers=localhost:9092
microgo.topics.ride-requests=ride.requests
microgo.topics.driver-generated=driver.generated
kafka.consumers.ride-request.group-id=driver.matching.group
kafka.consumers.driver-generated.group-id=ride.request.driver-projection.group
kafka.listeners.ride-request.id=rideListener
kafka.listeners.driver-generated.id=rideRequestDriverGeneratedListener
spring.datasource.url=jdbc:h2:mem:riderequestdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
